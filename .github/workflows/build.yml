name: Build Medqur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medqur-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Pharmacy + staff identity backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Start PostgreSQL and apply clinical schemas
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres

          ready=false
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U medqur -d medqur; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose logs postgres
            echo "PostgreSQL did not become ready in time." >&2
            exit 1
          fi

          # Do not depend on docker-entrypoint-initdb.d having run every file.
          # Explicitly replay the ordered, idempotent Medqur schemas so CI sees
          # the same complete clinical database on every fresh runner.
          for migration in sql/*.sql; do
            echo "Applying $migration"
            docker compose exec -T postgres \
              psql -U medqur -d medqur -v ON_ERROR_STOP=1 \
              < "$migration"
          done

          docker compose exec -T postgres psql -U medqur -d medqur -v ON_ERROR_STOP=1 -c "SELECT count(*) AS medqur_tables FROM information_schema.tables WHERE table_schema='public';"
          docker compose exec -T postgres psql -U medqur -d medqur -v ON_ERROR_STOP=1 -c "SELECT facility_id, code, name FROM inventory_locations;"
          docker compose exec -T postgres psql -U medqur -d medqur -v ON_ERROR_STOP=1 -c "SELECT generic_name, brand_name, approval_status FROM medication_products ORDER BY generic_name;"
          docker compose exec -T postgres psql -U medqur -d medqur -v ON_ERROR_STOP=1 -c "SELECT staff_number, display_name FROM staff_accounts ORDER BY staff_number;"

      - name: Smoke test live medication registry
        working-directory: backend
        env:
          DATABASE_URL: postgresql://medqur:medqur@127.0.0.1:5432/medqur
          MEDQUR_DEV_AUTH: "true"
          PORT: "8080"
        shell: bash
        run: |
          set -euo pipefail
          npx tsx src/server.ts >/tmp/medqur-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/medqur-backend.log || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json

          curl --fail --silent \
            'http://127.0.0.1:8080/v1/medications/resolve?gtin=18904215101509' \
            >/tmp/neurobalin.json
          cat /tmp/neurobalin.json
          python3 - <<'PY'
          import json
          with open('/tmp/neurobalin.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['found'] is True, payload
          product = payload['product']
          assert product['brandName'] == 'Neurobalin-75', product
          assert product['genericName'] == 'Pregabalin', product
          assert '18904215101509' in product['gtins'], product
          PY

          curl --fail --silent \
            'http://127.0.0.1:8080/v1/medications/search?q=pregabalin' \
            >/tmp/search.json
          cat /tmp/search.json
          python3 - <<'PY'
          import json
          with open('/tmp/search.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          results = payload['results']
          assert any(item['brand_name'] == 'Neurobalin-75' for item in results), results
          PY

      - name: Smoke test signed staff ID credentials
        working-directory: backend
        env:
          DATABASE_URL: postgresql://medqur:medqur@127.0.0.1:5432/medqur
          MEDQUR_DEV_AUTH: "true"
          IDENTITY_PORT: "8081"
          MEDQUR_STAFF_BADGE_KEY_ID: "ci-staff-badge-v1"
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ED25519 -out /tmp/medqur-staff-badge.pem
          export MEDQUR_STAFF_BADGE_SIGNING_PRIVATE_KEY_PEM="$(cat /tmp/medqur-staff-badge.pem)"

          npx tsx src/identity_server.ts >/tmp/medqur-identity.log 2>&1 &
          IDENTITY_PID=$!
          trap 'kill $IDENTITY_PID 2>/dev/null || true; cat /tmp/medqur-identity.log || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/health >/tmp/identity-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/identity-health.json

          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -H 'x-medqur-staff-id: 900001' \
            -H 'x-medqur-role: administrator' \
            -H 'x-medqur-facility: MRH' \
            -d '{"staffNumber":"482731","validDays":365}' \
            http://127.0.0.1:8081/v1/staff/credentials/issue \
            >/tmp/issued-badge.json
          cat /tmp/issued-badge.json

          TOKEN="$(python3 - <<'PY'
          import json
          with open('/tmp/issued-badge.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          badge = payload['badge']
          assert badge['staffNumber'] == '482731', badge
          token = badge['token']
          assert token.startswith('MQW1.'), token
          print(token)
          PY
          )"

          python3 - "$TOKEN" <<'PY' >/tmp/verify-body.json
          import json, sys
          print(json.dumps({'token': sys.argv[1]}))
          PY

          curl --fail --silent \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/verify-body.json \
            http://127.0.0.1:8081/v1/public/staff-badge/verify \
            >/tmp/verified-badge.json
          cat /tmp/verified-badge.json

          python3 - <<'PY'
          import json
          with open('/tmp/verified-badge.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['valid'] is True, payload
          staff = payload['staff']
          assert staff['staffNumber'] == '482731', staff
          assert staff['displayName'] == 'Dr. Maya Brown', staff
          assert any(item['role'] == 'doctor' for item in staff['permissions']), staff
          PY

          curl --fail --silent \
            -H 'x-medqur-staff-id: 482731' \
            -H 'x-medqur-role: doctor' \
            -H 'x-medqur-facility: MRH' \
            http://127.0.0.1:8081/v1/staff/badge \
            >/tmp/my-badge.json
          python3 - <<'PY'
          import json
          with open('/tmp/my-badge.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          badge = payload['badge']
          assert badge['staffNumber'] == '482731', badge
          assert badge['token'].startswith('MQW1.'), badge
          PY

  android-and-web:
    name: Android + Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and web platform scaffolding
        shell: bash
        run: |
          rm -rf /tmp/medqur_seed
          flutter create \
            --platforms=android,web \
            --org com.herbcure \
            --project-name medqur \
            /tmp/medqur_seed
          cp -R /tmp/medqur_seed/android ./android
          cp -R /tmp/medqur_seed/web ./web

      - name: Configure permissions, native auth and icons
        run: |
          python3 -m venv .icons-venv
          .icons-venv/bin/python -m pip install pillow
          .icons-venv/bin/python tool/configure_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test functional core
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release web app
        run: flutter build web --release --base-href "/Medqur/"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Medqur-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medqur-Web
          path: build/web
          if-no-files-found: error

      - name: Publish web build to gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

  ios:
    name: iOS unsigned
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform scaffolding
        shell: bash
        run: |
          rm -rf /tmp/medqur_seed
          flutter create \
            --platforms=ios \
            --org com.herbcure \
            --project-name medqur \
            /tmp/medqur_seed
          cp -R /tmp/medqur_seed/ios ./ios

      - name: Configure camera, Face ID and icons
        run: |
          python3 -m venv .icons-venv
          .icons-venv/bin/python -m pip install pillow
          .icons-venv/bin/python tool/configure_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app Medqur-iOS-unsigned.zip

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medqur-iOS-Unsigned
          path: Medqur-iOS-unsigned.zip
          if-no-files-found: error

  release-downloads:
    name: Publish easy downloads
    needs: [backend, android-and-web, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: Medqur-Android-APK
          path: release/android

      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: Medqur-iOS-Unsigned
          path: release/ios

      - name: Prepare download files
        shell: bash
        run: |
          mv release/android/app-release.apk release/Medqur-Android.apk
          mv release/ios/Medqur-iOS-unsigned.zip release/Medqur-iOS-Unsigned.zip
          cat > release/RELEASE_NOTES.md <<'EOF'
          # Medqur latest build

          Easy download copies of the latest successful Medqur build from `main`.

          - **Medqur-Android.apk** — Android release APK.
          - **Medqur-iOS-Unsigned.zip** — unsigned iOS `Runner.app` package. It is not an App Store/TestFlight-signed IPA and cannot be installed normally on an iPhone until it is code-signed.

          V0.11.4 bundles the browser-safe MRH prescription form, hardens prescription signature rendering, keeps the iPhone browser viewport at 1:1 scale, and requires biometric-only native staff unlock where Face ID, Touch ID, fingerprint, or supported face authentication is enrolled. Production clinical use still requires approved medication/formulary data, production OIDC/passkey infrastructure, approved clinical knowledge sources, Ministry/vendor integration access, security validation and signed deployment configuration.
          EOF

      - name: Replace latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete medqur-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create medqur-latest \
            release/Medqur-Android.apk \
            release/Medqur-iOS-Unsigned.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Medqur Latest Build" \
            --notes-file release/RELEASE_NOTES.md