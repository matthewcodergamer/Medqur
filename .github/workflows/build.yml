name: Build Medqur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: medqur-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Pharmacy backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Start PostgreSQL and apply medication schema
        working-directory: backend
        run: |
          docker compose up -d postgres
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U medqur -d medqur; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres psql -U medqur -d medqur -v ON_ERROR_STOP=1 -c "SELECT count(*) AS medication_tables FROM information_schema.tables WHERE table_schema='public';"
          docker compose exec -T postgres psql -U medqur -d medqur -v ON_ERROR_STOP=1 -c "SELECT facility_id, code, name FROM inventory_locations;"

  android-and-web:
    name: Android + Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and web platform scaffolding
        shell: bash
        run: |
          rm -rf /tmp/medqur_seed
          flutter create \
            --platforms=android,web \
            --org com.herbcure \
            --project-name medqur \
            /tmp/medqur_seed
          cp -R /tmp/medqur_seed/android ./android
          cp -R /tmp/medqur_seed/web ./web

      - name: Configure permissions, native auth and icons
        run: |
          python3 -m venv .icons-venv
          .icons-venv/bin/python -m pip install pillow
          .icons-venv/bin/python tool/configure_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test functional core
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release web app
        run: flutter build web --release --base-href "/Medqur/"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Medqur-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medqur-Web
          path: build/web
          if-no-files-found: error

      - name: Publish web build to gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

  ios:
    name: iOS unsigned
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform scaffolding
        shell: bash
        run: |
          rm -rf /tmp/medqur_seed
          flutter create \
            --platforms=ios \
            --org com.herbcure \
            --project-name medqur \
            /tmp/medqur_seed
          cp -R /tmp/medqur_seed/ios ./ios

      - name: Configure camera, Face ID and icons
        run: |
          python3 -m venv .icons-venv
          .icons-venv/bin/python -m pip install pillow
          .icons-venv/bin/python tool/configure_platforms.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app Medqur-iOS-unsigned.zip

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medqur-iOS-Unsigned
          path: Medqur-iOS-unsigned.zip
          if-no-files-found: error

  release-downloads:
    name: Publish easy downloads
    needs: [backend, android-and-web, ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: Medqur-Android-APK
          path: release/android

      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: Medqur-iOS-Unsigned
          path: release/ios

      - name: Prepare download files
        shell: bash
        run: |
          mv release/android/app-release.apk release/Medqur-Android.apk
          mv release/ios/Medqur-iOS-unsigned.zip release/Medqur-iOS-Unsigned.zip
          cat > release/RELEASE_NOTES.md <<'EOF'
          # Medqur latest build

          Easy download copies of the latest successful Medqur build from `main`.

          - **Medqur-Android.apk** — Android release APK.
          - **Medqur-iOS-Unsigned.zip** — unsigned iOS `Runner.app` package. It is not an App Store/TestFlight-signed IPA and cannot be installed normally on an iPhone until it is code-signed.

          V0.9 includes the medication-master/pharmacy platform foundation. Production clinical use still requires approved medication/formulary data, OIDC infrastructure, approved clinical knowledge sources, Ministry/vendor integration access, security validation and signed deployment configuration.
          EOF

      - name: Replace latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete medqur-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create medqur-latest \
            release/Medqur-Android.apk \
            release/Medqur-iOS-Unsigned.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Medqur Latest Build" \
            --notes-file release/RELEASE_NOTES.md
