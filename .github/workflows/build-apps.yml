name: Medqur app builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: flutter create . --org com.herbcure --project-name medqur --platforms=web,android
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/Medqur/"
      - uses: actions/upload-artifact@v4
        with:
          name: medqur-web
          path: build/web
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create . --org com.herbcure --project-name medqur --platforms=android
      - run: flutter pub get
      - name: Build Android release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: medqur-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS scaffold
        run: flutter create . --org com.herbcure --project-name medqur --platforms=ios
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package Runner.app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app medqur-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: medqur-ios-unsigned
          path: medqur-ios-unsigned.zip
          if-no-files-found: error
