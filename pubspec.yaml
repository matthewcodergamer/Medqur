publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
