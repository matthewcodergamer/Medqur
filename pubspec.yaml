name: medqur
description: Medqur clinical workflow prototype for web, iOS, and Android.
publish_to: "none"
version: 0.11.0+13

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  crypto: ^3.0.6
  cryptography: ^2.7.0
  http: ^1.5.0
  image: ^4.3.0
  image_picker: ^1.1.2
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/medqur_logo.png
    - assets/ministry_health_logo.png
    - assets/medqur_app_icon.svg
