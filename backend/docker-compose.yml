services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: medqur
      POSTGRES_USER: medqur
      POSTGRES_PASSWORD: medqur
    ports:
      - "5432:5432"
    volumes:
      - medqur_postgres:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medqur -d medqur"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  medqur_postgres:
